# Serving Galedra from your own machine or a small server (README "Serving it
# from home"). Same two services as development, but the production image and
# a production database. Two ways in:
#
#   1. Port forwarding: forward TCP 80 and 443 here and set TLS_DOMAIN; Thruster
#      obtains a certificate itself.
#   2. A Cloudflare tunnel, no router changes: leave TLS_DOMAIN unset, put a
#      named tunnel's token in CLOUDFLARE_TUNNEL_TOKEN, and start with the
#      tunnel profile. Cloudflare terminates TLS and reaches app:80 inside the
#      compose network.
#
#   docker compose -f compose.production.yaml up -d --build
#   docker compose -f compose.production.yaml --profile tunnel up -d --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata_production:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: bash -c "bin/rails db:prepare ledger:genesis ledger:release_models && exec ./bin/thrust ./bin/rails server"
    environment:
      DB_HOST: db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-galedra_production}
      SOLID_QUEUE_IN_PUMA: "true"
      TLS_DOMAIN: ${TLS_DOMAIN}
      LEDGER_ALLOWED_HOSTS: ${LEDGER_ALLOWED_HOSTS:-${TLS_DOMAIN}}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
    env_file:
      - path: .env
        required: false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - storage_production:/rails/storage
      - certs_production:/rails/storage/thruster
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [ tunnel ]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata_production:
  storage_production:
  certs_production:
