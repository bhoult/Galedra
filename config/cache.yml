default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

# One database, as the queue already is: solid_cache_entries lives in the
# primary schema, and naming a `cache` database that database.yml never defined
# stopped the production environment booting at all (audit, 2026-09-23).
production:
  <<: *default
