# Self-declared affiliations (owner request, 2026-09-19): what a person says
# about themselves so that, in aggregate, Galedra can show how different
# groups agree or disagree on a claim. Closed vocabulary, several groups, any
# number of picks, none required. Private to the account; shown only as
# counts, and only when a group is large enough (PersonalAssessments::MIN_GROUP).
# Adding an entry is a code change reviewed like any other.
groups:
  - slug: politics
    label: Politics
    options:
      - { slug: democrat, label: Democrat }
      - { slug: republican, label: Republican }
      - { slug: independent, label: Independent }
      - { slug: libertarian, label: Libertarian }
      - { slug: green, label: Green }
      - { slug: progressive, label: Progressive }
