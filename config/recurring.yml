# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  settle_lone_verdicts:
    class: SettleLoneVerdictsJob
    schedule: every hour at minute 30
  # An answered report waits on its reporter, and a reporter may never come
  # back. Half-hourly so the 3-hour window is honoured to within a half hour.
  settle_answered_reports:
    class: SettleAnsweredReportsJob
    schedule: every half hour
  # Stage 26 built the retention and scheduled it nowhere, so it only ever ran
  # when someone typed `bin/rails scores:prune`. The cache is keyed on the exact
  # seq and the head moves with every append, so an active writer leaves a fresh
  # row-set behind per seq: 413 distinct snapshot seqs against 258 rows useful at
  # head, on a dev node with one outline
  # (docs/experiments/2026-09-20-second-connector-run.md, finding 6).
  # Silence, not a conclusion. A thread nobody has touched leaves the work list
  # so it does not clog next_thread; any turn revives it with its turns and
  # votes intact (Stage 37).
  retire_silent_threads:
    class: RetireSilentThreadsJob
    schedule: every day at 4:10am
  prune_claim_scores:
    class: PruneClaimScoresJob
    schedule: every day at 3:20am
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

development:
  settle_lone_verdicts:
    class: SettleLoneVerdictsJob
    schedule: every hour at minute 30
  # An answered report waits on its reporter, and a reporter may never come
  # back. Half-hourly so the 3-hour window is honoured to within a half hour.
  settle_answered_reports:
    class: SettleAnsweredReportsJob
    schedule: every half hour
  # Silence, not a conclusion. A thread nobody has touched leaves the work list
  # so it does not clog next_thread; any turn revives it with its turns and
  # votes intact (Stage 37).
  retire_silent_threads:
    class: RetireSilentThreadsJob
    schedule: every day at 4:10am
  prune_claim_scores:
    class: PruneClaimScoresJob
    schedule: every day at 3:20am
