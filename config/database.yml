# One PostgreSQL database per environment. Solid Queue, Solid Cache, Solid Cable,
# and Active Storage metadata all live in it (spec 11 §2: one app, one database).
# Connection settings come from the environment; see .env.example.
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: galedra_development

test:
  <<: *default
  database: galedra_test

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "galedra_production") %>
